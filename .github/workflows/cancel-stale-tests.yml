name: Cancel stale test runs

on:
  workflow_run:
    workflows: [Code Test]
    types: [requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  cancel-stale-code-test:
    # workflow_run executes the workflow definition from the default branch,
    # so this job never executes untrusted PR code despite holding actions:write.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel older queued/running Code Test runs on this branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.event.workflow_run.id }}
          CURRENT_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CURRENT_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          [[ -n "$CURRENT_BRANCH" ]] || {
            echo "::error::Code Test workflow_run has no head branch"
            exit 1
          }

          response="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?per_page=100&branch=$CURRENT_BRANCH")"
          mapfile -t stale_ids < <(
            jq -r               --argjson current_id "$CURRENT_RUN_ID"               --argjson current_run_number "$CURRENT_RUN_NUMBER" '
                .workflow_runs[]
                | select(.id != $current_id)
                | select(.run_number < $current_run_number)
                | select(.status == "queued"
                      or .status == "pending"
                      or .status == "waiting"
                      or .status == "requested"
                      or .status == "in_progress")
                | .id
              ' <<<"$response"
          )

          for run_id in "${stale_ids[@]}"; do
            echo "Cancelling stale Code Test run $run_id on $CURRENT_BRANCH (replacement run $CURRENT_RUN_ID, sha=$CURRENT_SHA)"
            if ! gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1; then
              status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status + "/" + (.conclusion // "")' 2>/dev/null || true)"
              case "$status" in
                completed/*)
                  echo "Run $run_id already completed while cancellation raced: $status"
                  continue
                  ;;
                *)
                  echo "Normal cancellation for run $run_id did not complete immediately (status=$status); checking before force-cancel."
                  ;;
              esac
            fi

            completed=0
            for _ in 1 2 3 4 5; do
              status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status + "/" + (.conclusion // "")' 2>/dev/null || true)"
              case "$status" in
                completed/*)
                  echo "Run $run_id is no longer active: $status"
                  completed=1
                  break
                  ;;
              esac
              sleep 2
            done

            if (( completed == 0 )); then
              echo "Force-cancelling unresponsive stale Code Test run $run_id (status=$status)"
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null
            fi
          done
