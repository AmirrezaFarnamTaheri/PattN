name: Cancel stale test runs

on:
  push:
    branches:
      - master
      - my-releases
      - feat/discovery-reviver-integration
    # Keep this in lockstep with test.yml. A stale run is cancelled only when
    # this push also creates its replacement Code Test run.
    paths:
      - 'v2rayN/ServiceLib/**'
      - 'v2rayN/ServiceLib.UdpTest/**'
      - 'v2rayN/ServiceLib.Tests/**'
      - 'v2rayN/v2rayN/**'
      - 'v2rayN/v2rayN.Desktop/**'
      - 'v2rayN/Directory.Build.*'
      - 'v2rayN/Directory.Packages.props'
      - 'pattn-discovery/**'
      - 'global.json'
      - '.github/workflows/**'
      - 'package-*.sh'
      - 'release-assets.lock.sh'
      - 'release-reproducibility.sh'
      - 'scripts/deterministic_zip.py'
      - 'scripts/generate_dependency_sbom.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  cancel-stale-code-test:
    # Keep actions:write off pull_request entirely. PR runs use test.yml's native
    # concurrency cancellation; this API cleanup is only for trusted landing
    # pushes where a stuck runner can delay the normal cancellation transition.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel older queued/running Code Test runs on this ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          response="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?per_page=100&branch=$CURRENT_BRANCH")"
          mapfile -t stale_ids < <(
            jq -r --arg sha "$CURRENT_SHA" '
              .workflow_runs[]
              | select(.head_sha != $sha)
              | select(.status == "queued"
                    or .status == "pending"
                    or .status == "waiting"
                    or .status == "requested"
                    or .status == "in_progress")
              | .id
            ' <<<"$response"
          )

          for run_id in "${stale_ids[@]}"; do
            echo "Cancelling stale Code Test run $run_id on $CURRENT_BRANCH"
            if ! gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1; then
              # A race to completed/cancelled is benign. Re-read before deciding
              # whether this is a real cancellation failure.
              status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status + "/" + (.conclusion // "")' 2>/dev/null || true)"
              case "$status" in
                completed/*)
                  echo "Run $run_id already completed while cancellation raced: $status"
                  ;;
                *)
                  echo "::error::failed to cancel stale Code Test run $run_id (status=$status)"
                  exit 1
                  ;;
              esac
            fi
          done
