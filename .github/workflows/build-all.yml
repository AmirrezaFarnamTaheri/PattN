name: release all platforms

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string

permissions:
  actions: write
  contents: write

jobs:
  public-key:
    if: inputs.release_tag != ''
    uses: ./.github/workflows/pub-key.yml
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

  update:
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Trigger platform release workflows
        shell: bash
        run: |
          set -euo pipefail
          workflows=(
            build-windows.yml
            build-linux.yml
            build-osx.yml
            build-windows-desktop.yml
            build-windows-x86.yml
          )
          for workflow in "${workflows[@]}"; do
            gh workflow run "$workflow"               --repo "$GITHUB_REPOSITORY"               --ref "$REF_NAME"               -f "release_tag=$RELEASE_TAG"
          done
