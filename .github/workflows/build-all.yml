name: release all platforms

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    tags:
      - '*'

concurrency:
  group: release-all-${{ case(inputs.release_tag != '', inputs.release_tag, github.ref_name) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  public-key:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.release_tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/pub-key.yml
    with:
      release_tag: ${{ case(inputs.release_tag != '', inputs.release_tag, github.ref_name) }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

  update:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.release_tag != ''
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ case(inputs.release_tag != '', inputs.release_tag, github.ref_name) }}
      REF_NAME: ${{ case(inputs.release_tag != '', inputs.release_tag, github.ref_name) }}
    steps:
      - name: Trigger platform release workflows
        shell: bash
        run: |
          set -euo pipefail
          workflows=(
            build-windows.yml
            build-linux.yml
            build-osx.yml
            build-windows-desktop.yml
            build-windows-x86.yml
          )
          for workflow in "${workflows[@]}"; do
            gh workflow run "$workflow"               --repo "$GITHUB_REPOSITORY"               --ref "$REF_NAME"               -f "release_tag=$RELEASE_TAG"
          done
