name: release all platforms

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: PattN release tag (x.y.z or x.y.z-Pn)
        required: false
        type: string
  push:
    branches:
      - my-releases
    paths:
      - '.github/release-request.json'

concurrency:
  group: release-all-${{ case(inputs.release_tag != '', inputs.release_tag, github.ref_name) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: resolve immutable release ref
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_ref: ${{ steps.resolve.outputs.release_ref }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and pin release tag
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          tag=""
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_RELEASE_TAG" ]]; then
            tag="$INPUT_RELEASE_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$REF_NAME"
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/my-releases" ]]; then
            [[ -s .github/release-request.json ]] || {
              echo "::error::.github/release-request.json is required for branch-triggered release"
              exit 1
            }
            tag="$(jq -er '.release_tag' .github/release-request.json)"
          else
            echo "::error::could not resolve release tag for $EVENT_NAME / $GITHUB_REF"
            exit 1
          fi

          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-P[0-9]+)?$ ]] || {
            echo "::error::release tag must be x.y.z or x.y.z-Pn (got '$tag')"
            exit 1
          }

          version="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("v2rayN/Directory.Build.props").getroot()
          value = root.findtext(".//Version")
          if not value:
              raise SystemExit("Directory.Build.props has no Version")
          print(value.strip())
          PY
          )"
          if [[ "$tag" != "$version" && "$tag" != "$version"-P* ]]; then
            echo "::error::release tag '$tag' does not match application version '$version'"
            exit 1
          fi

          existing=""
          if existing="$(git rev-parse --verify --quiet "refs/tags/$tag")"; then
            [[ "$existing" == "$GITHUB_SHA" ]] || {
              echo "::error::tag '$tag' already points to $existing, not $GITHUB_SHA"
              exit 1
            }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" \
              -f "sha=$GITHUB_SHA" >/dev/null
          fi

          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_ref=$tag" >> "$GITHUB_OUTPUT"

  public-key:
    needs: prepare
    if: needs.prepare.outputs.release_tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/pub-key.yml
    with:
      release_tag: ${{ needs.prepare.outputs.release_tag }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

  update:
    needs: prepare
    if: needs.prepare.outputs.release_tag != ''
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      REF_NAME: ${{ needs.prepare.outputs.release_ref }}
      PLATFORM_WAIT_TIMEOUT_SECONDS: "19800"
    steps:
      - name: Trigger platform release workflows
        shell: bash
        run: |
          set -euo pipefail
          workflows=(
            build-windows.yml
            build-linux.yml
            build-osx.yml
            build-windows-desktop.yml
            build-windows-x86.yml
          )
          run_file="$RUNNER_TEMP/platform-release-runs.tsv"
          : > "$run_file"

          for workflow in "${workflows[@]}"; do
            dispatched_after="$(date -u +%s)"
            args=(
              workflow run "$workflow"
              --repo "$GITHUB_REPOSITORY"
              --ref "$REF_NAME"
              -f "release_tag=$RELEASE_TAG"
            )
            if [[ "$workflow" == "build-linux.yml" ]]; then
              # RISC-V and LoongArch are retained release targets, not proof-only
              # side jobs. The Linux reusable release must explicitly opt them in
              # when dispatched because workflow_dispatch defaults this input off.
              args+=(-f "exotic_arch=true")
            fi
            gh "${args[@]}"

            run_id=""
            for _ in $(seq 1 60); do
              response="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=workflow_dispatch&per_page=30")"
              run_id="$(jq -r \
                --arg sha "$GITHUB_SHA" \
                --arg ref "$REF_NAME" \
                --argjson after "$dispatched_after" '
                  [
                    .workflow_runs[]
                    | select(.event == "workflow_dispatch")
                    | select(.head_sha == $sha)
                    | select(.head_branch == $ref)
                    | select((.created_at | fromdateiso8601) >= $after)
                  ]
                  | sort_by(.created_at)
                  | last
                  | .id // empty
                ' <<<"$response")"
              [[ -n "$run_id" ]] && break
              sleep 2
            done
            [[ -n "$run_id" ]] || {
              echo "::error::could not discover dispatched run for $workflow at $REF_NAME / $GITHUB_SHA"
              exit 1
            }
            printf '%s\t%s\n' "$workflow" "$run_id" | tee -a "$run_file"
          done

      - name: Wait for platform release workflows
        shell: bash
        run: |
          set -euo pipefail
          run_file="$RUNNER_TEMP/platform-release-runs.tsv"
          [[ -s "$run_file" ]] || {
            echo "::error::platform release run ledger is missing"
            exit 1
          }

          deadline=$((SECONDS + PLATFORM_WAIT_TIMEOUT_SECONDS))
          while :; do
            pending=0
            failed=0

            while IFS=
              payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
              status="$(jq -r '.status' <<<"$payload")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$payload")"
              echo "$workflow run=$run_id status=$status conclusion=${conclusion:-pending}"

              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "::error::$workflow run $run_id completed with conclusion '$conclusion'"
                  failed=1
                fi
              else
                pending=$((pending + 1))
              fi
            done < "$run_file"

            (( failed == 0 )) || exit 1
            if (( pending == 0 )); then
              echo "All platform release workflows completed successfully."
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::timed out waiting for $pending platform release workflow(s)"
              exit 1
            fi
            sleep 20
          done
\t' read -r workflow run_id; do
              payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
              status="$(jq -r '.status' <<<"$payload")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$payload")"
              echo "$workflow run=$run_id status=$status conclusion=${conclusion:-pending}"

              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "::error::$workflow run $run_id completed with conclusion '$conclusion'"
                  failed=1
                fi
              else
                pending=$((pending + 1))
              fi
            done < "$run_file"

            (( failed == 0 )) || exit 1
            if (( pending == 0 )); then
              echo "All platform release workflows completed successfully."
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::timed out waiting for $pending platform release workflow(s)"
              exit 1
            fi
            sleep 20
          done
