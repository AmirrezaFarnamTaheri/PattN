name: release macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master
  pull_request:
    paths:
      - '.github/workflows/build-osx.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/package-zip.yml'
      - 'package-osx.sh'
      - 'release-assets.lock.sh'
      - 'pattn-discovery/**'
      - 'v2rayN/**'

permissions:
  contents: read
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.release_tag }}
      target: macos

  release-zip:
    if: github.event_name == 'pull_request' || inputs.release_tag != ''
    permissions:
      contents: write
      actions: read
    needs: build
    uses: ./.github/workflows/package-zip.yml
    with:
      target: macos
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit
    
  dmg:
    name: package and release macOS dmg
    if: github.event_name == 'pull_request' || inputs.release_tag != ''
    needs: build
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    runs-on: macos-latest
    env:
      PackageVersion: ${{ case(inputs.release_tag != '', inputs.release_tag, '0.0.0') }}
      Arch: ${{ case(matrix.arch == 'x64', '64', matrix.arch) }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Restore build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: ${{ matrix.arch }}
        path: PattN-macos-${{ env.Arch }}
    
    - name: Setup create-dmg
      run: brew install create-dmg

    - name: Ensure script permissions
      run: chmod 755 package-osx.sh release-assets.lock.sh

    - name: Package dmg
      run: ./package-osx.sh "macos-$Arch" "PattN-macos-$Arch" "$PackageVersion"

    - name: Smoke final DMG payload
      shell: bash
      run: |
        set -euo pipefail
        dmg="PattN-macos-$Arch.dmg"
        mount_dir="$RUNNER_TEMP/pattn-dmg-$Arch"
        mkdir -p "$mount_dir"
        hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
        cleanup() { hdiutil detach "$mount_dir" -quiet || true; }
        trap cleanup EXIT

        app="$mount_dir/PattN.app/Contents/MacOS"
        helper="$app/bin/pattn-discovery/pattn-discovery"
        [[ -x "$app/PattN" ]] || { echo "::error::DMG is missing executable PattN"; exit 1; }
        [[ -s "$helper" && -x "$helper" ]] || { echo "::error::DMG is missing executable pattn-discovery"; exit 1; }
        file "$helper"

        host_arch="$(uname -m)"
        if [[ ("$Arch" == "64" && "$host_arch" == "x86_64") || ("$Arch" == "arm64" && "$host_arch" == "arm64") ]]; then
          output="$(printf '%s\n' '{"v":1,"id":"dmg-smoke","method":"engine.version"}' | "$helper")"
          grep -F '"id":"dmg-smoke"' <<<"$output"
          grep -F '"engine":"pattn-discovery"' <<<"$output"
        fi

        cleanup
        trap - EXIT

    - name: Upload dmg artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: release-dmg-${{ matrix.arch }}
        path: PattN*.dmg
        if-no-files-found: error

  release-dmg:
    name: sign and upload macOS dmg
    if: github.event_name != 'pull_request' && inputs.release_tag != ''
    permissions:
      contents: write
      actions: read
    needs: dmg
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    uses: ./.github/workflows/upload-sign.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      artifact_name: release-dmg-${{ matrix.arch }}
      file_pattern: '*.dmg'
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
