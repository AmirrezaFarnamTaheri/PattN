name: release macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master
  pull_request:
    paths:
      - '.github/workflows/build-osx.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/package-zip.yml'
      - 'scripts/deterministic_zip.py'
      - 'scripts/generate_dependency_sbom.py'
      - 'package-osx.sh'
      - 'release-assets.lock.sh'
      - 'pattn-discovery/**'
      - 'v2rayN/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.release_tag }}
      target: macos

  release-zip:
    if: github.event_name == 'pull_request' || inputs.release_tag != ''
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    needs: build
    uses: ./.github/workflows/package-zip.yml
    with:
      target: macos
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit
    
  dmg:
    name: package and release macOS dmg
    if: github.event_name == 'pull_request' || inputs.release_tag != ''
    needs: build
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    runs-on: macos-latest
    env:
      PackageVersion: ${{ case(inputs.release_tag != '', inputs.release_tag, '0.0.0') }}
      Arch: ${{ case(matrix.arch == 'x64', '64', matrix.arch) }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Restore build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: ${{ matrix.arch }}
        path: PattN-macos-${{ env.Arch }}
    
    - name: Setup create-dmg
      run: brew install create-dmg

    - name: Ensure script permissions
      run: chmod 755 package-osx.sh release-assets.lock.sh

    - name: Import Apple signing certificate
      if: github.event_name != 'pull_request'
      shell: bash
      env:
        APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      run: |
        set -euo pipefail
        [[ -n "$APPLE_CERTIFICATE_P12_BASE64" && -n "$APPLE_CERTIFICATE_PASSWORD" && -n "$APPLE_SIGNING_IDENTITY" ]] || {
          echo "::error::macOS release requires Apple signing certificate secrets"
          exit 1
        }
        keychain="$RUNNER_TEMP/pattn-signing.keychain-db"
        password="$(openssl rand -hex 24)"
        security create-keychain -p "$password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$password" "$keychain"
        printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$RUNNER_TEMP/pattn-signing.p12"
        security import "$RUNNER_TEMP/pattn-signing.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        security list-keychains -d user -s "$keychain" login.keychain-db
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"

    - name: Package dmg
      env:
        PATTN_MACOS_CODESIGN_IDENTITY: ${{ github.event_name != 'pull_request' && secrets.APPLE_SIGNING_IDENTITY || '' }}
      run: ./package-osx.sh "macos-$Arch" "PattN-macos-$Arch" "$PackageVersion"

    - name: Prove unsigned app payload reproducibility
      if: github.event_name == 'pull_request'
      shell: bash
      run: |
        set -euo pipefail
        epoch="$(git show -s --format=%ct HEAD)"
        app="v2rayN-Package-macos-$Arch/PattN.app"
        first="$RUNNER_TEMP/PattN-macos-$Arch-first.zip"
        second="$RUNNER_TEMP/PattN-macos-$Arch-second.zip"

        python3 scripts/deterministic_zip.py "$app" "$first" --epoch "$epoch"

        rm -rf "v2rayN-Package-macos-$Arch" "PattN-macos-$Arch.dmg"
        ./package-osx.sh "macos-$Arch" "PattN-macos-$Arch" "$PackageVersion"
        python3 scripts/deterministic_zip.py "$app" "$second" --epoch "$epoch"

        cmp "$first" "$second" || {
          echo "::error::Unsigned PattN.app payload is not byte-for-byte reproducible for macos-$Arch"
          shasum -a 256 "$first" "$second" || true
          exit 1
        }

    - name: Notarize and staple DMG
      if: github.event_name != 'pull_request'
      shell: bash
      env:
        APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
      run: |
        set -euo pipefail
        [[ -n "$APPLE_NOTARY_KEY_ID" && -n "$APPLE_NOTARY_ISSUER_ID" && -n "$APPLE_NOTARY_PRIVATE_KEY_BASE64" ]] || {
          echo "::error::macOS release requires Apple notarization secrets"
          exit 1
        }
        key="$RUNNER_TEMP/AuthKey_$APPLE_NOTARY_KEY_ID.p8"
        printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_BASE64" | base64 -D > "$key"
        dmg="PattN-macos-$Arch.dmg"
        xcrun notarytool submit "$dmg" \
          --key "$key" \
          --key-id "$APPLE_NOTARY_KEY_ID" \
          --issuer "$APPLE_NOTARY_ISSUER_ID" \
          --wait
        xcrun stapler staple "$dmg"
        xcrun stapler validate "$dmg"

    - name: Smoke final DMG payload
      shell: bash
      run: |
        set -euo pipefail
        dmg="PattN-macos-$Arch.dmg"
        mount_dir="$RUNNER_TEMP/pattn-dmg-$Arch"
        mkdir -p "$mount_dir"
        hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
        cleanup() { hdiutil detach "$mount_dir" -quiet || true; }
        trap cleanup EXIT

        app="$mount_dir/PattN.app/Contents/MacOS"
        helper="$app/bin/pattn-discovery/pattn-discovery"
        [[ -x "$app/PattN" ]] || { echo "::error::DMG is missing executable PattN"; exit 1; }
        [[ -s "$helper" && -x "$helper" ]] || { echo "::error::DMG is missing executable pattn-discovery"; exit 1; }
        file "$helper"

        host_arch="$(uname -m)"
        if [[ ("$Arch" == "64" && "$host_arch" == "x86_64") || ("$Arch" == "arm64" && "$host_arch" == "arm64") ]]; then
          output="$(printf '%s\n' '{"v":1,"id":"dmg-smoke","method":"engine.version"}' | "$helper")"
          grep -F '"id":"dmg-smoke"' <<<"$output"
          grep -F '"engine":"pattn-discovery"' <<<"$output"
        fi

        cleanup
        trap - EXIT

    - name: Upload dmg artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: release-dmg-${{ matrix.arch }}
        path: PattN*.dmg
        if-no-files-found: error

  release-dmg:
    name: sign and upload macOS dmg
    if: github.event_name != 'pull_request' && inputs.release_tag != ''
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    needs: dmg
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    uses: ./.github/workflows/upload-sign.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      artifact_name: release-dmg-${{ matrix.arch }}
      file_pattern: '*.dmg'
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
