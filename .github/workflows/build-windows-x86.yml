name: release Windows x86

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/build-windows-x86.yml'
      - 'pattn-discovery/**'
      - 'v2rayN/**'
      - 'release-assets.lock.sh'

permissions:
  contents: read
  actions: read

jobs:
  package-x86:
    name: build and release windows x86 WPF & Avalonia
    if: github.event_name == 'pull_request' || inputs.release_tag != ''
    runs-on: windows-latest
    env:
      ReleaseTag: ${{ github.event_name == 'pull_request' && '0.0.0' || inputs.release_tag }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: wpf
            project: ./v2rayN/v2rayN/v2rayN.csproj
            zip_name: PattN-windows-86.zip
          - flavor: desktop
            project: ./v2rayN/v2rayN.Desktop/v2rayN.Desktop.csproj
            zip_name: PattN-windows-86-desktop.zip

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Purge SDKs
        shell: pwsh
        run: |
          echo "Before:"
          dotnet --list-sdks
          
          dotnet --list-sdks | % {
            $_ -match '^\S+\s+\[(.+)\]$' > $null
            $d = Join-Path $Matches[1] $_.Split()[0]
            Write-Host "Removing $d"
            if ($IsWindows) { rm $d -r -fo } else { sudo rm -rf "$d" }
          }

          echo "After:"
          dotnet --list-sdks 2>$null; $LASTEXITCODE=0

      - name: Setup .NET 10.0.1xx
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.111

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.23.12'
          cache: false

      - name: Check release tag
        shell: pwsh
        run: |
          if ($env:ReleaseTag -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-P[0-9]+)?$') { throw "release_tag must be x.y.z-P<n> (got '$env:ReleaseTag')" }

      - name: Publish ${{ matrix.flavor }} win-x86
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet restore "${{ matrix.project }}" -r win-x86

          dotnet publish "${{ matrix.project }}" `
            -c Release `
            -r win-x86 `
            -p:SelfContained=true `
            -p:EnableWindowsTargeting=true `
            "-p:Version=$env:ReleaseTag" `
            -o "publish/${{ matrix.flavor }}"

      - name: Publish AmazTool win-x86
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet publish "./v2rayN/AmazTool/AmazTool.csproj" `
            -c Release `
            -r win-x86 `
            -p:SelfContained=true `
            -p:PublishTrimmed=true `
            -p:EnableWindowsTargeting=true `
            "-p:Version=$env:ReleaseTag" `
            -o "publish/${{ matrix.flavor }}"

      - name: Build pattn-discovery win-x86
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Resolve-Path ".").Path
          $output = Join-Path $root "publish/${{ matrix.flavor }}/bin/pattn-discovery/pattn-discovery.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $output) | Out-Null

          Push-Location "pattn-discovery"
          try {
            go test ./...
            if ($LASTEXITCODE -ne 0) { throw "pattn-discovery tests failed" }

            go vet ./...
            if ($LASTEXITCODE -ne 0) { throw "pattn-discovery vet failed" }

            $env:CGO_ENABLED = "0"
            $env:GOOS = "windows"
            $env:GOARCH = "386"
            go build -buildvcs=false -trimpath -ldflags="-s -w" -o $output ./cmd/pattn-discovery
            if ($LASTEXITCODE -ne 0) { throw "pattn-discovery build failed" }
          }
          finally {
            Pop-Location
          }

      - name: Smoke bundled pattn-discovery win-x86
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $helper = Resolve-Path "publish/${{ matrix.flavor }}/bin/pattn-discovery/pattn-discovery.exe"
          $response = '{"v":1,"id":"smoke","method":"engine.version"}' | & $helper.Path
          if ($LASTEXITCODE -ne 0) {
            throw "pattn-discovery smoke handshake failed with exit code $LASTEXITCODE"
          }
          $parsed = $response | ConvertFrom-Json
          if ($parsed.id -ne "smoke" -or $parsed.data.engine -ne "pattn-discovery") {
            throw "pattn-discovery returned an unexpected smoke response: $response"
          }

      - name: Download locked x86 cores and rule assets
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=release-assets.lock.sh
          source ./release-assets.lock.sh

          root="publish/${{ matrix.flavor }}"
          bin="$root/bin"
          xray_dir="$bin/xray"
          sing_dir="$bin/sing_box"
          srss_dir="$bin/srss"
          work="tmp/x86-assets"

          rm -rf "$work"
          mkdir -p "$work/xray" "$work/sing-box" "$xray_dir" "$sing_dir" "$srss_dir"

          xray_sha="$(pattn_xray_sha256 windows-32)"
          pattn_download_sha256 \
            "https://github.com/patterniha/Xray-core/releases/download/v${PATTN_XRAY_VERSION}/Xray-windows-32.zip" \
            "$work/xray.zip" \
            "$xray_sha"
          7z x -y "-o$work/xray" "$work/xray.zip" >/dev/null
          xray_exe="$(find "$work/xray" -type f -iname 'xray.exe' -print -quit)"
          [[ -n "$xray_exe" ]] || { echo "::error::locked Xray archive did not contain xray.exe"; exit 1; }
          cp -f "$xray_exe" "$xray_dir/xray.exe"

          sing_sha="$(pattn_singbox_sha256 windows-386)"
          pattn_download_sha256 \
            "https://github.com/SagerNet/sing-box/releases/download/v${PATTN_SINGBOX_VERSION}/sing-box-${PATTN_SINGBOX_VERSION}-windows-386.zip" \
            "$work/sing-box.zip" \
            "$sing_sha"
          7z x -y "-o$work/sing-box" "$work/sing-box.zip" >/dev/null
          sing_exe="$(find "$work/sing-box" -type f -iname 'sing-box.exe' -print -quit)"
          [[ -n "$sing_exe" ]] || { echo "::error::locked sing-box archive did not contain sing-box.exe"; exit 1; }
          cp -f "$sing_exe" "$sing_dir/sing-box.exe"
          cronet="$(find "$work/sing-box" -type f -iname 'libcronet*.dll' -print -quit)"
          [[ -z "$cronet" ]] || cp -f "$cronet" "$sing_dir/libcronet.dll"

          pattn_download_sha256 \
            "https://github.com/Chocolate4U/Iran-v2ray-rules/releases/download/${PATTN_IRAN_GEO_RELEASE}/geosite.dat" \
            "$bin/geosite.dat" \
            "$PATTN_IRAN_GEOSITE_SHA256"
          pattn_download_sha256 \
            "https://github.com/Chocolate4U/Iran-v2ray-rules/releases/download/${PATTN_IRAN_GEO_RELEASE}/geoip.dat" \
            "$bin/geoip.dat" \
            "$PATTN_IRAN_GEOIP_SHA256"

          expected="$(pattn_raw_rule_blob_sha1 loyal geoip-only-cn-private.dat)"
          pattn_download_git_blob \
            "https://raw.githubusercontent.com/Loyalsoldier/geoip/${PATTN_LOYALSOLDIER_GEOIP_COMMIT}/geoip-only-cn-private.dat" \
            "$bin/geoip-only-cn-private.dat" \
            "$expected"
          expected="$(pattn_raw_rule_blob_sha1 loyal Country.mmdb)"
          pattn_download_git_blob \
            "https://raw.githubusercontent.com/Loyalsoldier/geoip/${PATTN_LOYALSOLDIER_GEOIP_COMMIT}/Country.mmdb" \
            "$bin/Country.mmdb" \
            "$expected"

          pattn_download_git_blob \
            "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/${PATTN_METACUBEX_RELEASE_COMMIT}/geoip.metadb" \
            "$bin/geoip.metadb" \
            "$PATTN_METACUBEX_GEOIP_METADB_BLOB_SHA1"

          for f in \
            geoip-private.srs \
            geoip-cn.srs \
            geoip-facebook.srs \
            geoip-fastly.srs \
            geoip-google.srs \
            geoip-netflix.srs \
            geoip-telegram.srs \
            geoip-twitter.srs
          do
            expected="$(pattn_raw_rule_blob_sha1 geoip "$f")"
            pattn_download_git_blob \
              "https://raw.githubusercontent.com/2dust/sing-box-rules/${PATTN_SING_RULE_GEOIP_COMMIT}/$f" \
              "$srss_dir/$f" \
              "$expected"
          done

          for f in \
            geosite-cn.srs \
            geosite-gfw.srs \
            geosite-google.srs \
            geosite-greatfire.srs \
            geosite-geolocation-cn.srs \
            geosite-category-ads-all.srs \
            geosite-private.srs
          do
            expected="$(pattn_raw_rule_blob_sha1 geosite "$f")"
            pattn_download_git_blob \
              "https://raw.githubusercontent.com/2dust/sing-box-rules/${PATTN_SING_RULE_GEOSITE_COMMIT}/$f" \
              "$srss_dir/$f" \
              "$expected"
          done

          for f in geosite-category-ir.srs geoip-ir.srs; do
            expected="$(pattn_raw_rule_blob_sha1 iran "$f")"
            pattn_download_git_blob \
              "https://raw.githubusercontent.com/chocolate4u/Iran-sing-box-rules/${PATTN_IRAN_SING_RULES_COMMIT}/$f" \
              "$srss_dir/$f" \
              "$expected"
          done

      - name: Package zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Compress-Archive `
            -Path "publish/${{ matrix.flavor }}/*" `
            -DestinationPath "${{ matrix.zip_name }}" `
            -Force

      - name: Upload zip artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-windows-x86-${{ matrix.flavor }}
          path: ${{ matrix.zip_name }}
          if-no-files-found: error

  release-x86:
    name: sign and upload windows x86
    if: github.event_name != 'pull_request' && inputs.release_tag != ''
    permissions:
      contents: write
      actions: read
    needs: package-x86
    strategy:
      fail-fast: false
      matrix:
        flavor: [ wpf, desktop ]
    uses: ./.github/workflows/upload-sign.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      artifact_name: release-windows-x86-${{ matrix.flavor }}
      file_pattern: '*.zip'
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
