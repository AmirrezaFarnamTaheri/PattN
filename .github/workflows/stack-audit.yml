name: Stack & Localization Audit

# Static gates for the Discovery/Reviver review stack. Both checks are pure
# (git + python3, no toolchain), so they run on every PR in seconds and guard
# the two failure modes this repo has actually hit:
#   1. a split PR drifting behind its own base and silently reverting hardening
#      when merged  -> scripts/check_stack_sync.py
#   2. a view binding a resource key that was deleted from ResUI.resx, which
#      compiles and throws at window load -> scripts/check_localization.py

on:
  pull_request:
    paths:
      - '.github/workflows/stack-audit.yml'
      - 'scripts/check_stack_sync.py'
      - 'scripts/check_localization.py'
      - 'v2rayN/ServiceLib/Resx/**'
      - 'v2rayN/ServiceLib/Discovery/**'
      - 'v2rayN/ServiceLib/Reviver/**'
      - 'v2rayN/ServiceLib/Helper/SqliteHelper.cs'
      - 'v2rayN/ServiceLib/Manager/AppManager.cs'
      - 'v2rayN/v2rayN/**'
      - 'v2rayN/v2rayN.Desktop/**'
      - 'pattn-discovery/**'
  push:
    branches:
      - my-releases
      - feat/discovery-reviver-integration
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  localization-parity:
    name: ResUI key parity (R1/R2/R3)
    runs-on: ubuntu-latest
    steps:
      # Pinned to the same full commit SHA the repo's other workflows use: the
      # "Audit release packaging integrity lock" step rejects any `uses:` that is
      # not a 40-hex digest, so an unpinned tag here fails *every* PR's validate job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # No setup-python: ubuntu-latest's python3 is >= 3.11, which is all these
      # stdlib-only gates need -- and actions/setup-python is not pinned anywhere
      # in this repo, so there is no SHA here I could honestly reuse.
      - name: Scoped to this PR's checkout
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_localization.py
      - name: Whole tree (push / manual)
        if: github.event_name != 'pull_request'
        run: python3 scripts/check_localization.py

  stack-sync:
    name: Split-stack integrity (base ancestry + blob parity)
    runs-on: ubuntu-latest
    steps:
      # Pinned to the same full commit SHA the repo's other workflows use: the
      # "Audit release packaging integrity lock" step rejects any `uses:` that is
      # not a 40-hex digest, so an unpinned tag here fails *every* PR's validate job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # No setup-python: ubuntu-latest's python3 is >= 3.11, which is all these
      # stdlib-only gates need -- and actions/setup-python is not pinned anywhere
      # in this repo, so there is no SHA here I could honestly reuse.
      - name: Split PRs contain their base tip and match the integration ref
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_stack_sync.py

      # A push to the integration branch (or my-releases) advances the base of every PR stacked on it.
      # Those PRs are legitimately "behind" until they are resynced, and that finding belongs to no PR
      # under review -- so on a push the gate enforces the invariant that actually reverts hardening when
      # a split merges late (blob parity), and ancestry stays where it is actionable: the PR event.
      - name: Split PRs match the integration ref (parity only after a base move)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_stack_sync.py --skip-base-ancestry
