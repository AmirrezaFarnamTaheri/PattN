name: build

on:
  workflow_call:
    inputs:
      target: # windows linux macos
        required: true
        type: string
      project:
        required: false
        type: string
        default: './v2rayN.Desktop/v2rayN.Desktop.csproj'
      version: # PattN: release tag used as the app version (x.y.z-P<n>); empty keeps Directory.Build.props
        required: false
        type: string
        default: ''

jobs:
  build:
    name: build x64 arm64
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    runs-on: |-
      ${{
        case(
          inputs.target == 'macos', 'macos-latest',
          inputs.target == 'linux', 'ubuntu-24.04',
          inputs.target == 'windows', 'windows-latest',
          'ubuntu-latest'
        )
      }}
    env:
      Output: "${{ github.workspace }}/${{ matrix.arch }}"
      RID: |-
        ${{
          case(
            inputs.target == 'macos', format('osx-{0}', matrix.arch),
            inputs.target == 'windows', format('win-{0}', matrix.arch),
            format('{0}-{1}', inputs.target, matrix.arch)
          )
        }}
      Project: ${{ inputs.project }}
      Version: ${{ inputs.version }}
      ExtOpt: |-
        ${{
          case(
            inputs.target == 'windows', '-p:EnableWindowsTargeting=true',
            ''
          )
        }}
      DiscoveryTarget: ${{ inputs.target }}
      DiscoveryArch: ${{ matrix.arch }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Purge SDKs
      shell: pwsh
      run: |
        echo "Before:"
        dotnet --list-sdks
        
        dotnet --list-sdks | % {
          $_ -match '^\S+\s+\[(.+)\]$' > $null
          $d = Join-Path $Matches[1] $_.Split()[0]
          Write-Host "Removing $d"
          if ($IsWindows) { rm $d -r -fo } else { sudo rm -rf "$d" }
        }
        
        echo "After:"
        dotnet --list-sdks 2>$null; $LASTEXITCODE=0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.1xx

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: './pattn-discovery/go.mod'
        cache: false
        
    - name: Check version
      if: inputs.version != ''
      shell: bash
      run: |
        [[ "$Version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-P[0-9]+)?$ ]] || { echo "::error::release_tag must be x.y.z-P<n> (got '$Version')"; exit 1; }
        Base="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' v2rayN/Directory.Build.props | head -n 1)"
        [[ "${Version%%-P*}" == "$Base" ]] || { echo "::error::release_tag '$Version' must be based on upstream version $Base (Directory.Build.props), e.g. $Base-P1"; exit 1; }

    - name: Build v2rayN
      shell: bash
      working-directory: ./v2rayN
      run: |
        set -euo pipefail
        extra_args=()
        [[ -n "$ExtOpt" ]] && extra_args+=("$ExtOpt")
        [[ -n "$Version" ]] && extra_args+=("-p:Version=$Version")
        dotnet publish "$Project" -c Release -r "$RID" -p:SelfContained=true "${extra_args[@]}" -o "$Output"

    - name: Build AmazTool
      shell: bash
      working-directory: ./v2rayN
      run: |
        set -euo pipefail
        extra_args=()
        [[ -n "$ExtOpt" ]] && extra_args+=("$ExtOpt")
        [[ -n "$Version" ]] && extra_args+=("-p:Version=$Version")
        dotnet publish ./AmazTool/AmazTool.csproj -c Release -r "$RID" -p:SelfContained=true -p:PublishTrimmed=true "${extra_args[@]}" -o "$Output"

    - name: Build pattn-discovery
      shell: bash
      working-directory: ./pattn-discovery
      run: |
        set -euo pipefail

        case "$DiscoveryTarget" in
          macos) GOOS=darwin ;;
          windows) GOOS=windows ;;
          linux) GOOS=linux ;;
          *) echo "Unsupported discovery target: $DiscoveryTarget" >&2; exit 1 ;;
        esac

        case "$DiscoveryArch" in
          x64) GOARCH=amd64 ;;
          arm64) GOARCH=arm64 ;;
          *) echo "Unsupported discovery architecture: $DiscoveryArch" >&2; exit 1 ;;
        esac

        EXE=pattn-discovery
        if [[ "$GOOS" == "windows" ]]; then
          EXE=pattn-discovery.exe
        fi

        go test ./...
        go vet ./...

        mkdir -p "$Output/bin/pattn-discovery"
        CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
          go build -trimpath -ldflags="-s -w" \
          -o "$Output/bin/pattn-discovery/$EXE" ./cmd/pattn-discovery

    - name: Smoke bundled pattn-discovery on native runner
      if: (matrix.arch == 'x64' && runner.arch == 'X64') || (matrix.arch == 'arm64' && runner.arch == 'ARM64')
      shell: bash
      run: |
        set -euo pipefail
        helper="$Output/bin/pattn-discovery/pattn-discovery"
        if [[ "$DiscoveryTarget" == "windows" ]]; then
          helper="$helper.exe"
        fi
        [[ -s "$helper" ]] || { echo "::error::missing bundled discovery helper: $helper"; exit 1; }
        output="$(printf '%s\n' '{"v":1,"id":"smoke","method":"engine.version"}' | "$helper")"
        grep -F '"id":"smoke"' <<<"$output"
        grep -F '"engine":"pattn-discovery"' <<<"$output"

    - name: Remove Debug Symbols
      shell: bash
      run: |
        find ${{ matrix.arch }} -type f -name '*.pdb' -delete

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.arch }}
        path: ${{ matrix.arch }}
