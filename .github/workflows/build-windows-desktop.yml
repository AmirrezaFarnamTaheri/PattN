name: release Windows desktop (Avalonia UI)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master
  pull_request:
    paths:
      - '.github/workflows/build-windows-desktop.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/package-zip.yml'
      - 'scripts/deterministic_zip.py'
      - 'pattn-discovery/**'
      - 'v2rayN/**'

permissions:
  contents: read
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.release_tag }}
      target: windows

  release-zip:
    if: github.event_name == 'pull_request' || inputs.release_tag != ''
    permissions:
      contents: write
      actions: read
    needs: build
    uses: ./.github/workflows/package-zip.yml
    with:
      target: windows-desktop
      release_tag: ${{ inputs.release_tag }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
