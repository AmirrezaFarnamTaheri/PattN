name: sign and upload release files

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      file_pattern:
        required: false
        type: string
        default: '**/*'
      content_type:
        required: false
        type: string
        default: application/octet-stream
    secrets:
      GPG_PRIVATE_KEY:
        required: true

permissions:
  contents: write
  actions: read

jobs:
  upload:
    runs-on: ubuntu-26.04
    steps:
    - name: Download release artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact_name }}
        path: dist

    - name: Validate release inputs
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        set -euo pipefail
        [[ "$RELEASE_TAG" =~ ^[0-9]+.[0-9]+.[0-9]+(-P[0-9]+)?$ ]] || {
          echo "::error::release_tag must be x.y.z or x.y.z-Pn (got '$RELEASE_TAG')"
          exit 1
        }

    - name: Import GPG private key
      shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      run: |
        set -euo pipefail
        install -m 700 -d ~/.gnupg
        printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

    - name: Sign release files
      shell: bash
      env:
        FILE_PATTERN: ${{ inputs.file_pattern }}
      run: |
        set -euo pipefail
        cd dist
        case "$FILE_PATTERN" in
          /*|../*|*/../*|*/..)
            echo "file_pattern must stay within the downloaded artifact: $FILE_PATTERN" >&2
            exit 1
            ;;
        esac
        shopt -s globstar nullglob
        mapfile -t files < <(compgen -G "$FILE_PATTERN" || true)
        (( ${#files[@]} )) || { echo "No files matched: $FILE_PATTERN"; exit 1; }
        for f in "${files[@]}"; do
          [[ -f "$f" ]] || continue
          gpg --batch --yes --armor --detach-sign --output "$f.sig" "$f"
        done

    - name: Upload signed assets with GitHub CLI
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.release_tag }}
        FILE_PATTERN: ${{ inputs.file_pattern }}
      run: |
        set -euo pipefail
        cd dist
        shopt -s globstar nullglob
        mapfile -t files < <(compgen -G "$FILE_PATTERN" || true)
        (( ${#files[@]} )) || { echo "No release files matched: $FILE_PATTERN"; exit 1; }

        assets=()
        for f in "${files[@]}"; do
          [[ -f "$f" ]] || continue
          [[ -f "$f.sig" ]] || { echo "Missing signature for $f"; exit 1; }
          assets+=("$f" "$f.sig")
        done
        (( ${#assets[@]} )) || { echo "No regular release files matched"; exit 1; }

        if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release create "$RELEASE_TAG" --title "PattN v$RELEASE_TAG" --notes "." --prerelease
        fi
        gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
