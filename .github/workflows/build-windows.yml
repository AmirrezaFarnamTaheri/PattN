name: release Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master
  pull_request:
    paths:
      - '.github/workflows/build-windows.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/package-zip.yml'
      - 'scripts/deterministic_zip.py'
      - 'scripts/generate_dependency_sbom.py'
      - 'pattn-discovery/**'
      - 'v2rayN/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.release_tag }}
      target: windows
      project: ./v2rayN/v2rayN.csproj

  release-zip:
    if: github.event_name == 'pull_request' || inputs.release_tag != ''
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    needs: build
    uses: ./.github/workflows/package-zip.yml
    with:
      target: windows
      release_tag: ${{ inputs.release_tag }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
