name: package and release Zip

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      target: # windows linux macos windows-desktop
        required: true
        type: string
      publish_release:
        required: false
        type: boolean
        default: true
    secrets:
      GPG_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  package:
    name: package x64 arm64
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    runs-on: ubuntu-latest
    env:
      Target: |- 
        ${{
          case(
            inputs.target == 'windows-desktop', 'windows',
            inputs.target
          )
        }}
      Arch: |-
        ${{
          case(
            matrix.arch == 'x64', '64',
            matrix.arch
          ) 
        }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Restore build artifacts
      uses: actions/download-artifact@v8
      with:
        name: ${{ matrix.arch }}
        path: PattN-${{ env.Target }}-${{ env.Arch }}

    - name: Bundle locked runtime assets
      shell: bash
      run: |
        set -euo pipefail
        # shellcheck source=release-assets.lock.sh
        source ./release-assets.lock.sh
        rid="$Target-$Arch"

        core_blob="$(pattn_core_bundle_blob_sha1 "$rid")" || {
          echo "::error::no locked core bundle for $rid"
          exit 1
        }
        core_url="https://raw.githubusercontent.com/2dust/v2rayN-core-bin/${PATTN_CORE_BIN_COMMIT}/v2rayN-${Target}-${Arch}.zip"
        pattn_download_git_blob "$core_url" core-bin.zip "$core_blob"
        7z x -y core-bin.zip
        cp -an "v2rayN-$Target-$Arch/." "PattN-$Target-$Arch/"

        case "$rid" in
          windows-64)    asset=Xray-windows-64.zip ;;
          windows-arm64) asset=Xray-windows-arm64-v8a.zip ;;
          linux-64)      asset=Xray-linux-64.zip ;;
          linux-arm64)   asset=Xray-linux-arm64-v8a.zip ;;
          macos-64)      asset=Xray-macos-64.zip ;;
          macos-arm64)   asset=Xray-macos-arm64-v8a.zip ;;
          *) echo "::error::no Xray asset mapping for $rid"; exit 1 ;;
        esac
        xray_sha="$(pattn_xray_sha256 "$rid")" || {
          echo "::error::no locked Xray digest for $rid"
          exit 1
        }
        pattn_download_sha256           "https://github.com/patterniha/Xray-core/releases/download/v${PATTN_XRAY_VERSION}/$asset"           xray-core.zip           "$xray_sha"
        7z x -y -oxray-core xray-core.zip
        mkdir -p "PattN-$Target-$Arch/bin/xray"
        cp -f xray-core/xray* "PattN-$Target-$Arch/bin/xray/"
        chmod +x "PattN-$Target-$Arch/bin/xray/xray" 2>/dev/null || true

        pattn_download_sha256           "https://github.com/Chocolate4U/Iran-v2ray-rules/releases/download/${PATTN_IRAN_GEO_RELEASE}/geosite.dat"           "PattN-$Target-$Arch/bin/geosite.dat"           "$PATTN_IRAN_GEOSITE_SHA256"
        pattn_download_sha256           "https://github.com/Chocolate4U/Iran-v2ray-rules/releases/download/${PATTN_IRAN_GEO_RELEASE}/geoip.dat"           "PattN-$Target-$Arch/bin/geoip.dat"           "$PATTN_IRAN_GEOIP_SHA256"

        mkdir -p "PattN-$Target-$Arch/bin/srss"
        for rule in geosite-category-ir.srs geoip-ir.srs; do
          expected="$(pattn_raw_rule_blob_sha1 iran "$rule")" || {
            echo "::error::no locked Iran rule digest for $rule"
            exit 1
          }
          pattn_download_git_blob             "https://raw.githubusercontent.com/chocolate4u/Iran-sing-box-rules/${PATTN_IRAN_SING_RULES_COMMIT}/$rule"             "PattN-$Target-$Arch/bin/srss/$rule"             "$expected"
        done

    - name: Verify bundled pattn-discovery
      shell: bash
      run: |
        set -euo pipefail
        helper="PattN-$Target-$Arch/bin/pattn-discovery/pattn-discovery"
        if [[ "$Target" == "windows" ]]; then
          helper="$helper.exe"
        fi
        [[ -s "$helper" ]] || { echo "::error::missing bundled discovery helper: $helper"; exit 1; }

    - name: Package zip archive
      run: 7z a -tZip "PattN-$Target-$Arch.zip" "PattN-$Target-$Arch" -mx1

    - name: Rename windows-desktop
      if: inputs.target == 'windows-desktop'
      run: mv "PattN-$Target-$Arch.zip" "PattN-$Target-$Arch-desktop.zip"

    - name: Upload zip artifact
      uses: actions/upload-artifact@v7
      with:
        name: release-${{ inputs.target }}-${{ matrix.arch }}
        path: PattN*.zip
        if-no-files-found: error

  release:
    if: inputs.publish_release && inputs.release_tag != ''
    permissions:
      contents: write
      actions: read
    name: sign and upload zip x64 arm64
    needs: package
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    uses: ./.github/workflows/upload-sign.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      artifact_name: release-${{ inputs.target }}-${{ matrix.arch }}
      file_pattern: '*.zip'
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
